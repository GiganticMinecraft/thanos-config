name: release-please

# Conventional Commits に基づいて next release PR を bot に作らせる。
# release PR を merge すると semver tag が切られる。これが seichi_infra 側の
# ArgoCD Application が参照する targetRevision の供給源になる
# (= Renovate ArgoCD manager は tag は追えるが branch は追えないため)。

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: simple
