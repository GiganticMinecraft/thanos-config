name: ci

on:
  pull_request:
    paths:
      - main.jsonnet
      - .github/workflows/ci.yaml
  push:
    branches:
      - main
    paths:
      - main.jsonnet
      - .github/workflows/ci.yaml

jobs:
  jsonnet:
    name: jsonnet eval
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install go-jsonnet
        env:
          # renovate: datasource=github-releases depName=google/go-jsonnet
          JSONNET_VERSION: 0.22.0
        run: |
          curl -fsSL \
            "https://github.com/google/go-jsonnet/releases/download/v${JSONNET_VERSION}/go-jsonnet_${JSONNET_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin jsonnet
          jsonnet --version

      - name: Render main.jsonnet
        run: jsonnet main.jsonnet > /dev/null
